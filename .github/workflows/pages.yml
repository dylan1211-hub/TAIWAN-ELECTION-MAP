name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build election data
        run: |
          rm -rf /tmp/cec
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kiang/db.cec.gov.tw.git /tmp/cec
          cd /tmp/cec
          git sparse-checkout set data/elections/2020-2024 data/2018 data/2022
          rm -rf /tmp/local-election-dataset
          git clone --depth 1 https://github.com/LiuYuWei/2022-local-election-dataset.git /tmp/local-election-dataset
          cd "$GITHUB_WORKSPACE"
          python3 scripts/build_election_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
