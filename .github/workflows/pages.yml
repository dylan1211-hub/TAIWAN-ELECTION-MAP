name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build election data
        run: |
          rm -rf /tmp/cec
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kiang/db.cec.gov.tw.git /tmp/cec
          cd /tmp/cec
          git sparse-checkout set data/elections/2020-2024 data/2018 data/2022 voteData/2022-111年地方公職人員選舉/C1
          rm -rf /tmp/local-election-dataset
          git clone --depth 1 https://github.com/LiuYuWei/2022-local-election-dataset.git /tmp/local-election-dataset
          cd "$GITHUB_WORKSPACE"
          curl -L "https://taiwanvotes.tw/data/csv/%E7%B8%A3%E5%B8%82%E9%95%B7_2022_%E5%98%89%E7%BE%A9%E5%B8%82.csv?v=20260803111705" -o /tmp/chiayi_mayor_2022.csv
          python3 scripts/build_election_data.py
          python3 - <<'PY'
          import csv, json
          from collections import defaultdict
          path="/tmp/chiayi_mayor_2022.csv"
          out="data/elections.json"
          towns={}
          with open(path,encoding="utf-8-sig",newline="") as f:
              for r in csv.DictReader(f):
                  if r.get("縣市")!="嘉義市" or r.get("鄉鎮市區") not in ("東區","西區"):
                      continue
                  name=(r.get("候選人") or "").strip()
                  if not name:
                      continue
                  try:
                      votes=int((r.get("得票數") or "0").replace(",",""))
                  except:
                      votes=0
                  key=f"mayor-嘉義市-{r['鄉鎮市區']}"
                  b=towns.setdefault(key,{"county":"嘉義市","town":r["鄉鎮市區"],"candidates":defaultdict(lambda:{"party":"","votes":0})})
                  b["candidates"][name]["party"]=r.get("政黨") or "無黨籍及未經政黨推薦"
                  b["candidates"][name]["votes"]+=votes
          for b in towns.values():
              rows=sorted(b["candidates"].items(),key=lambda x:-x[1]["votes"])
              total=sum(v["votes"] for _,v in rows)
              b["totalVotes"]=total
              b["candidates"]=[{"name":n,"party":v["party"],"votes":v["votes"],"share":round(v["votes"]/total*100,2) if total else 0} for n,v in rows]
          with open(out,encoding="utf-8") as f:
              data=json.load(f)
          data["mayor"]["towns"].update(towns)
          with open(out,"w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,separators=(",",":"))
          print("Chiayi mayor districts:", len(towns))
          for k,v in sorted(towns.items()):
              print(k, v["totalVotes"], [(x["name"],x["votes"]) for x in v["candidates"]])
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
